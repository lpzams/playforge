# Publishes the static showcase (showcase/site) to GitHub Pages on every push to master that touches it.
name: Showcase

on:
  push:
    branches: [master]
    paths: ['showcase/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/site
      - id: deployment
        uses: actions/deploy-pages@v4
