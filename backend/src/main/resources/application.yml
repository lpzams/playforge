server:
  port: 8090   # 8080 is commonly taken by other local Java apps

spring:
  application:
    name: playforge
  datasource:
    url: jdbc:h2:file:./data/playforge;MODE=MySQL
    username: sa
    password: ""
  flyway:
    enabled: true

playforge:
  workspace-root: ../workspaces
  orchestration:
    max-review-rounds: 3
    max-playtest-fixes: 2
    step-timeout: 10m
    run-timeout: 30m
    max-engine-retries: 3
    retry-base-delay: 30s
  engines:
    coder: demo
    reviewer: demo
  sandbox:
    provider: local
    image: playforge-sandbox:p2
    pool-size: 2
    acquire-timeout: 60s
    codex-auth-file: ${USERPROFILE:${user.home}}/.codex/auth.json
    docker-command: docker
