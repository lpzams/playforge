<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayForge</title>
  <meta name="repo-url" content="https://github.com/lpzams/playforge" />
  <link rel="stylesheet" href="style.css?v=__BUILD__" />
</head>
<body class="game-page">
  <nav class="topbar">
    <div class="topbar-inner wide">
      <a class="icon-btn" href="./" aria-label="返回游戏广场">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a class="wordmark" href="./">PlayForge</a>
      <span class="spacer"></span>
      <a class="text-link repo-link" href="#">GitHub</a>
    </div>
  </nav>

  <main class="game-layout">
    <section class="play-col">
      <div id="stage" class="player-stage"></div>
      <div class="player-bar">
        <span class="hint">用 ← → 和空格操作</span>
        <button id="reload" class="pill plain" type="button">重新开始</button>
        <button id="fullscreen" class="pill tonal" type="button">全屏</button>
      </div>
    </section>

    <aside class="side-col">
      <header class="game-head">
        <h1 id="game-title"></h1>
        <div id="game-meta" class="game-meta"></div>
        <p id="game-prompt" class="game-prompt"></p>
      </header>

      <section class="story">
        <h2>它是怎么做出来的</h2>
        <p id="story-sub" class="story-sub"></p>
        <ol id="feed" class="feed"></ol>
      </section>
    </aside>
  </main>

  <script src="common.js?v=__BUILD__"></script>
  <script src="game.js?v=__BUILD__"></script>
</body>
</html>
