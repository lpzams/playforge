<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayForge</title>
  <meta name="repo-url" content="https://github.com/lpzams/playforge" />
  <link rel="stylesheet" href="style.css?v=__BUILD__" />
</head>
<body class="game-page">
  <nav class="topbar">
    <div class="topbar-inner wide">
      <a class="icon-btn" href="./" aria-label="返回游戏广场">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a class="wordmark" href="./">PlayForge</a>
      <span class="spacer"></span>
      <a class="text-link repo-link" href="#">GitHub</a>
    </div>
  </nav>

  <main class="game-layout">
    <div id="stage" class="player-stage"></div>

    <header class="game-head">
      <div class="game-title-block">
        <h1 id="game-title"></h1>
        <div id="game-meta" class="game-meta"></div>
      </div>
      <div class="player-actions">
        <span class="hint">用 ← → 和空格操作</span>
        <button id="reload" class="pill plain" type="button">重新开始</button>
        <button id="fullscreen" class="pill tonal" type="button">全屏</button>
      </div>
    </header>
    <p id="game-prompt" class="game-prompt"></p>

    <section id="guard" class="guard" hidden></section>

    <section class="story">
      <div class="story-head">
        <div>
          <h2>它是怎么做出来的</h2>
          <p id="story-sub" class="story-sub"></p>
        </div>
        <button id="replay" class="pill tonal" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
          回放生成过程
        </button>
      </div>
      <div id="replay-bar" class="replay-bar" hidden>
        <button class="pill tonal" data-act="toggle" type="button">暂停</button>
        <input type="range" min="0" max="1" value="0" step="1" aria-label="回放进度" />
        <span class="replay-time">0:00</span>
        <span class="speeds">
          <button class="chip" data-speed="1" aria-pressed="true" type="button">1×</button>
          <button class="chip" data-speed="2" aria-pressed="false" type="button">2×</button>
          <button class="chip" data-speed="4" aria-pressed="false" type="button">4×</button>
        </span>
        <button class="pill plain" data-act="exit" type="button">退出回放</button>
      </div>
      <ol id="feed" class="feed"></ol>
    </section>
  </main>

  <script src="common.js?v=__BUILD__"></script>
  <script src="replay.js?v=__BUILD__"></script>
  <script src="game.js?v=__BUILD__"></script>
</body>
</html>
