<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏广场 · PlayForge</title>
  <meta name="description" content="由 AI 写、审、试玩生成的小游戏：Claude 写代码、Codex 审查、Playwright 驱动的 AI 试玩发现问题自动修复。" />
  <meta name="repo-url" content="https://github.com/lpzams/playforge" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="notice">
      这里的每个游戏都由 <b>PlayForge</b> 根据一句话自动生成：Claude 写代码 · Codex 审查 · AI 在浏览器里试玩，发现问题自动修复。
      <a class="readme-link" href="#">《工作原理》</a><a class="repo-link" href="#">《源码》</a>
    </div>

    <header class="head">
      <div>
        <h1>游戏广场</h1>
        <p class="sub">由 AI 写、审、试玩生成的小游戏，点开即玩，还能看它是怎么被做出来的。</p>
      </div>
      <a class="btn repo-link" href="#">GitHub 源码</a>
    </header>

    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="搜索游戏" />
      </label>
      <button id="sort" class="btn" type="button">⇅ 最新生成</button>
      <button id="filter-bug" class="btn" type="button" aria-pressed="false">修过 bug</button>
    </div>

    <div class="meta-row">
      <span><b id="count">0</b> 个游戏</span>
      <span id="sort-label" class="muted">按生成时间排序</span>
      <div class="view-toggle" role="group" aria-label="视图">
        <button id="view-grid" type="button" class="active" aria-label="网格视图">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="view-list" type="button" aria-label="列表视图">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div id="game-list" class="cards"></div>
    <p id="empty" class="empty" hidden>没有匹配的游戏</p>

    <footer class="footer muted">PlayForge · 数据导出于 <span id="exported-at"></span></footer>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div id="modal-avatar" class="avatar sm"></div>
        <h3 id="modal-title"></h3>
        <span id="modal-ver" class="ver"></span>
        <button type="button" class="close" data-close aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div>
          <div class="stage" id="modal-stage"></div>
          <div class="hint muted">先点一下画面，再用 方向键 / 空格 操作</div>
          <div id="modal-prompt" class="modal-prompt"></div>
        </div>
        <div class="modal-process" id="modal-process"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
