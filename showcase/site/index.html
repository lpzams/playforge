<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏广场 · PlayForge</title>
  <meta name="description" content="一句话生成的小游戏：Claude 写代码、Codex 审查、在浏览器里自动试玩，发现问题自动修复。" />
  <meta name="repo-url" content="https://github.com/lpzams/playforge" />
  <link rel="stylesheet" href="style.css?v=__BUILD__" />
</head>
<body>
  <nav class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="./">PlayForge</a>
      <span class="spacer"></span>
      <a class="text-link readme-link" href="#">工作原理</a>
      <a class="text-link repo-link" href="#">GitHub</a>
    </div>
  </nav>

  <main class="page">
    <section class="intro">
      <h1>游戏广场</h1>
      <p>这里的每个游戏都只来自一句话描述。Claude 写代码，Codex 审查，再由程序在浏览器里真的去玩一遍，有问题就改，直到能玩为止。</p>
    </section>

    <label class="search">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="搜索游戏" />
    </label>

    <div class="filters">
      <button id="sort-newest" class="chip" type="button" aria-pressed="true">最新</button>
      <button id="sort-fastest" class="chip" type="button" aria-pressed="false">用时最短</button>
      <button id="filter-bug" class="chip" type="button" aria-pressed="false">审查中改过问题</button>
      <span id="count" class="count"></span>
    </div>

    <div id="game-list" class="cards"></div>
    <p id="empty" class="empty" hidden>没有匹配的游戏</p>
  </main>

  <footer class="footer">数据导出于 <span id="exported-at"></span></footer>

  <script src="common.js?v=__BUILD__"></script>
  <script src="app.js?v=__BUILD__"></script>
</body>
</html>
